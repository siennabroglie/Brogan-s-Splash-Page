<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      font-family: 'Caveat', cursive;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    #click-catcher {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
    }
    #click-catcher.open { display: block; }

    /* Panel — anchored top-right, scaled to sit beside the help icon.
       Clips everything inside it, grows downward on open.                 */
    #menu-panel {
      position: absolute;
      top: 0; right: 0;
      z-index: 60;            /* above #click-catcher (50) so labels stay hoverable/clickable */
      transform: scale(0.65);
      transform-origin: top right;
      background: transparent;
      cursor: pointer;
      width: 360px;
      height: 72px;
      overflow: hidden;
      transition: height 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Inner container — burger pinned to the right edge */
    #burger-wrap {
      position: absolute;
      top: 0; right: 8px;
      width: 56px;
      /* height expands to hold all spread ingredients */
      height: 56px;
      transition: height 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Each ingredient is absolutely positioned, slides to its open Y */
    .ing {
      position: absolute;
      right: 0;
      width: 56px;
      transition: top 0.6s cubic-bezier(0.34, 1.1, 0.64, 1);
    }
    /* width:100% only — each layer's height falls out of its own aspect ratio, so re-exporting
       the art at a different resolution can never change how tall it renders. */
    .ing img { display: block; width: 100%; }

    /* Labels sit to the LEFT of the burger, right-aligned, absolutely positioned */
    /* Menu labels — flat GREY boxes matching the Mind Barn site: a 1pt border one shade
       lighter than the box, a slight drop shadow, Caveat text, and orange as the hover
       highlight (white text on an orange fill). */
    .ing-label {
      position: absolute;
      /* Sits the same 20.4px clear of the burger as the game's "?" help box does, so the labels and
         the help box share one right edge — 84px in from the viewport, which is where #helpBtn ends.
         In panel coords rather than screen: #menu-panel is scaled 0.65 about its top-right, and this
         offset is measured from #burger-wrap, itself 8px in. So 84px on screen is (84-22)/0.65 - 8.
         The 22 is #menuFrame's own right offset in index.html — change either and redo this. */
      right: 87.38px;
      text-align: right;
      font-family: 'Caveat', cursive;
      /* 35px here renders ~23px on screen once the panel's 0.65 scale is applied. */
      font-size: 35px;
      color: #141414;
      background: #c6c6c6;
      border: 1px solid #e6e6e6;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.28);
      padding: 4px 14px;
      border-radius: 0;
      text-decoration: none;
      white-space: nowrap;
      opacity: 0;
      transform: translateX(6px);
      transition: opacity 0.3s ease, transform 0.3s ease, color 0.2s ease, background 0.2s ease, border-color 0.2s ease;
      pointer-events: none;
      /* vertically centered on its ingredient */
      line-height: 1;
    }
    .ing-label.visible {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }
    .ing-label:hover { color: #fff; background: #f2872e; border-color: #f2872e; }
  </style>
</head>
<body>

<div id="click-catcher"></div>

<div id="menu-panel">
  <div id="burger-wrap">

    <!-- Each .ing carries data-closed (stacked) and data-open (spread) tops, in px.
         Order top to bottom: top bun, tomato, cheese, patty, lettuce, bottom bun — the same
         sequence closed AND open, so layers never cross over each other mid-animation.
         The closed tops reproduce burgerMenuCondensed.png: a tight stack 47px tall in which each
         filling shows only a 3-5px sliver. That file is the reference for the collapsed look; it
         is deliberately not shipped, since the six layers have to move independently. -->

    <div class="ing" id="ing-bun-top" data-closed="0" data-open="0">
      <img src="burgerMenu-assets/burgerMenu_topBun.png" alt="" draggable="false">
    </div>

    <div class="ing" id="ing-tomato" data-closed="5" data-open="80">
      <img src="burgerMenu-assets/burgerMenu_tomato.png" alt="" draggable="false">
    </div>

    <div class="ing" id="ing-cheese" data-closed="10" data-open="160">
      <img src="burgerMenu-assets/burgerMenu_cheese.png" alt="" draggable="false">
    </div>

    <div class="ing" id="ing-patty" data-closed="15" data-open="240">
      <img src="burgerMenu-assets/burgerMenu_patty.png" alt="" draggable="false">
    </div>

    <div class="ing" id="ing-lettuce" data-closed="20" data-open="320">
      <img src="burgerMenu-assets/burgerMenu_lettuce.png" alt="" draggable="false">
    </div>

    <div class="ing" id="ing-bun-bottom" data-closed="26" data-open="400">
      <img src="burgerMenu-assets/burgerMenu_bottomBun.png" alt="" draggable="false">
    </div>

    <!-- Labels — top set by JS to vertically center on open ingredient position -->
    <!-- Top and bottom buns intentionally have no menu label -->
    <!-- Listed in the order they read down the screen, matching the filling each one sits beside:
         tomato, cheese, patty, lettuce. The id keeps the INGREDIENT's name rather than the menu
         item's, because layers is what pairs the two and the wording is expected to keep changing.

         _top, not a bare href: this document is loaded in an iframe, so an untargeted link
         navigates the IFRAME and loads the destination inside the little menu box. -->
    <a class="ing-label" id="label-tomato"  target="_top"
       href="https://mindbarn.org/about">About</a>
    <a class="ing-label" id="label-cheese"  target="_top"
       href="https://mindbarn.org">Manifesto</a>
    <a class="ing-label" id="label-patty"   target="_top"
       href="https://www.youtube.com/@borg22222/playlists">Highlights</a>
    <a class="ing-label" id="label-lettuce" target="_top"
       href="https://mindbarn.org/works-in-progress">Works in Progress</a>

  </div>
</div>

<script>
  const panel   = document.getElementById('menu-panel');
  const wrap    = document.getElementById('burger-wrap');
  const catcher = document.getElementById('click-catcher');

  // ingH is each layer's RENDERED height at the fixed 56px column width, i.e. 56 x (h/w) of the
  // source art. It drives panel sizing and label centring, so it has to match what the browser
  // actually lays out — these are measured from the PNGs, not guessed.
  const layers = [
    { ing: 'ing-bun-top',    label: null,               ingH: 21.8 },
    { ing: 'ing-tomato',     label: 'label-tomato',     ingH: 20.9 },
    { ing: 'ing-cheese',     label: 'label-cheese',     ingH: 21.1 },
    { ing: 'ing-patty',      label: 'label-patty',      ingH: 18.9 },
    { ing: 'ing-lettuce',    label: 'label-lettuce',    ingH: 17.2 },
    { ing: 'ing-bun-bottom', label: null,               ingH: 21.1 },
  ];

  const PANEL_PADDING = 8;  // panel padding top
  const WRAP_MARGIN   = 8;  // burger-wrap margin

  let isOpen = false;

  // Tell the parent page (the game) when we open/close so it can resize this
  // iframe — small when closed (so the game stays clickable), full-screen when
  // open (so the click-to-close catcher works).
  function notifyParent(state) {
    if (window.parent !== window) window.parent.postMessage('burger-' + state, '*');
  }

  // Read closed/open positions from data attributes
  layers.forEach((l, i) => {
    const el = document.getElementById(l.ing);
    l.closedTop = parseFloat(el.dataset.closed);
    l.openTop   = parseFloat(el.dataset.open);
    // Set initial position
    el.style.top = l.closedTop + 'px';
    // Paint order: the topmost layer laps OVER the one beneath it, all the way down. The .ing divs
    // are absolutely positioned with no z-index of their own, so without this the browser falls back
    // to DOM order and paints later elements on top — stacking the burger inside out, bottom bun
    // over everything. It went unnoticed with the old inline SVG stand-ins because they barely
    // overlapped; the real art has thick outlines and deep overlap, so it shows immediately.
    // Derived from the array index rather than hard-coded in the CSS: `layers` is the one place the
    // order is declared, so reordering it reorders the paint stack too and the two cannot drift.
    // NB: set before the early return below, or the buns (which carry no label) would never get one.
    el.style.zIndex = layers.length - i;
    // Pre-position labels at open pos, centered on ingredient
    if (!l.label) return;
    const labelEl = document.getElementById(l.label);
    labelEl.style.top = (l.openTop + l.ingH / 2 - 22) + 'px';
  });

  // Closed sizes
  const lastLayer   = layers[layers.length - 1];
  const CLOSED_WRAP = lastLayer.closedTop + lastLayer.ingH;
  const CLOSED_PANEL = CLOSED_WRAP + PANEL_PADDING + WRAP_MARGIN + 8;

  // Open sizes
  const OPEN_WRAP  = lastLayer.openTop + lastLayer.ingH;
  const OPEN_PANEL = OPEN_WRAP + PANEL_PADDING + WRAP_MARGIN + 16;

  wrap.style.height  = CLOSED_WRAP + 'px';
  panel.style.height = CLOSED_PANEL + 'px';

  function openMenu() {
    isOpen = true;
    notifyParent('open');
    catcher.classList.add('open');

    // Slide ingredients apart
    layers.forEach(l => {
      document.getElementById(l.ing).style.top = l.openTop + 'px';
    });

    // Grow panel and wrap
    wrap.style.height  = OPEN_WRAP + 'px';
    panel.style.height = OPEN_PANEL + 'px';

    // Stagger labels
    layers.forEach((l, i) => {
      if (!l.label) return;
      setTimeout(() => {
        document.getElementById(l.label).classList.add('visible');
      }, 280 + i * 65);
    });
  }

  function closeMenu() {
    isOpen = false;
    notifyParent('closed');
    catcher.classList.remove('open');

    // Hide labels
    layers.forEach(l => { if (l.label) document.getElementById(l.label).classList.remove('visible'); });

    // Slide ingredients back together
    layers.forEach(l => {
      document.getElementById(l.ing).style.top = l.closedTop + 'px';
    });

    // Shrink panel
    wrap.style.height  = CLOSED_WRAP + 'px';
    panel.style.height = CLOSED_PANEL + 'px';
  }

  panel.addEventListener('click', e => {
    e.stopPropagation();
    isOpen ? closeMenu() : openMenu();
  });

  catcher.addEventListener('click', closeMenu);

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && isOpen) closeMenu();
  });
</script>

</body>
</html>
