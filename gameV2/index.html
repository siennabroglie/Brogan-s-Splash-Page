  _jt.player = performance.now() - _t0;   // iso keys, crouch, feet planting, jump, terrain rays
  const _t1 = performance.now();

  // Ground PNGs sway — sampled at each plane's own position so a gust ripples across them.
  for (let i = 0; i < windPlanes.length; i++) {
    const wp = windPlanes[i];
    const node = wp.pivot || wp.mesh;
    // Proximity ramp — how "awake" this prop is (0..1) as the player approaches. Every prop gets
    // one, but only props built with fx render the wake-up effect off it. It no longer gates
    // clicks: a linked prop is clickable at any range (see pickAction).
    // Measured from the prop's RESTING height, so lifting it can't feed back into its own ramp.
    const dx = tpCamera.position.x - node.position.x;
    const dy = tpCamera.position.y - wp.baseY;
    const dz = tpCamera.position.z - node.position.z;
    const gd = Math.sqrt(dx * dx + dy * dy + dz * dz);
    wp.prox = 1 - BABYLON.Scalar.Clamp((gd - PROX_NEAR) / (PROX_FAR - PROX_NEAR), 0, 1);
    if (wp.wake) {
      const a = wp.prox * wp.prox * (3 - 2 * wp.prox);   // smoothstep — eases in at both ends
      wp.wake.wake = a;
      node.position.y = wp.baseY + wp.lift * a;          // lift off the page; the sun sits well
                                                         // off vertical, so the cast shadow
                                                         // slides out from under the sheet
    }
    // windPlanes is the eight props now, nothing more, so every one of them animates every frame in
    // both modes. The distance and mode gating that used to live here was for the decorations, and
    // they are no longer individual meshes — see buildDecor().
    const w = getWind(windT, node.position.x, node.position.z);
    const flutter = 0.7 + 0.5 * Math.sin(windT * 2.0 + wp.phase) + 0.2 * Math.sin(windT * 3.3 + wp.phase * 1.7);
    if (wp.style === 'lean') {
      const a = w.strength * LEAN_GAIN * flutter;   // tip the top downwind (small-angle approx)
      wp.pivot.rotation.x = a * w.dz;   // forward/back pitch only (about X), tracks wind toward/away
      wp.pivot.rotation.z = 0;          // never roll side-to-side
    } else if (wp.style === 'paper') {
      // Paper flap — out-of-plane (local Z) travelling ripple, anchored at the base...
      const pos = wp.mesh.getVerticesData(BABYLON.VertexBuffer.PositionKind), rest = wp.rest;
      const amp = PAPER_AMP * wp.W * w.strength;
      for (let v = 0; v < pos.length; v += 3) {
        const nx = rest[v] / wp.W + 0.5, ny = rest[v + 1] / wp.H;   // 0..1, ny=0 at base
        const edge = ny * ny;                                       // base planted, top/edges flap most
        const wave = Math.sin(nx * 6.0 + ny * 4.0 - windT * 3.0 + wp.phase)
                   + 0.5 * Math.sin(nx * 9.0 - ny * 5.0 - windT * 4.3 + wp.phase * 1.7);
        pos[v + 2] = rest[v + 2] + amp * edge * wave;               // out-of-plane wobble
        pos[v]     = rest[v]     + amp * 0.3 * edge * Math.sin(ny * 3.0 - windT * 2.0 + wp.phase);
      }
      wp.mesh.updateVerticesData(BABYLON.VertexBuffer.PositionKind, pos);
      // ...AND tip the whole sheet downwind about its base (lean) on top of the ripple.
      const a = w.strength * LEAN_GAIN * flutter;
      wp.pivot.rotation.x = a * w.dz;   // forward/back pitch only (about X), tracks wind toward/away
      wp.pivot.rotation.z = 0;          // never roll side-to-side
    } else {   // 'bend'
      const sway = w.strength * BEND_GAIN * flutter * wp.H;
      const pos = wp.mesh.getVerticesData(BABYLON.VertexBuffer.PositionKind), rest = wp.rest;
      for (let v = 0; v < pos.length; v += 3) {
        const tt = rest[v + 1] / wp.H;            // 0 at base → 1 at top
        pos[v] = rest[v] + tt * tt * sway;        // bend along local X
      }
      wp.mesh.updateVerticesData(BABYLON.VertexBuffer.PositionKind, pos);

  }

  _jt.sway = performance.now() - _t1;
  const _t2 = performance.now();

  if (updateDecorSway) updateDecorSway();   // decorations lean too — one matrix buffer per art file
  _jt.decor = performance.now() - _t2;
  const _t3 = performance.now();

  _jt.anims = performance.now() - _t3;
  const _t3b = performance.now();

  _jt.arrows = performance.now() - _t3b;
  const _t4 = performance.now();

  _jt.hover = performance.now() - _t4;

  // Prevent collision slide-response from pushing the player upward.
  // moveWithCollisions computes a slide vector along the hit surface normal;
  // if that normal has any upward component (corners, angled faces, ledge edges)
  // the Y accumulates faster than gravity can cancel it. Clamping to ≤0 allows
  // gravity to pull down normally but kills any collision-induced upward drift.
  if (mode === 'tp') {
    if (isJumping) {                                                            // ease applied velocity toward
      jumpAppliedVY += (jumpVelY - jumpAppliedVY) * JUMP_SMOOTH;                // target → smooth launch & land
      tpCamera.cameraDirection.y = jumpAppliedVY;
    } else tpCamera.cameraDirection.y = Math.min(0, tpCamera.cameraDirection.y); // original anti-drift
  }

  scene.render();
});

})(); // end async IIFE
