    let touched = true;

    switch (e.code) {
      // Nudge the whole animation's anchor; with a frame selected past the first, nudge THAT
      // frame's offset instead, so a frame that doesn't register on the shared anchor can be
      // pulled into line without dragging the others with it.
      case 'KeyJ': if (frame) f.dx = (f.dx || 0) - step; else pa.def.x -= step; break;
      case 'KeyL': if (frame) f.dx = (f.dx || 0) + step; else pa.def.x += step; break;
      case 'KeyK': if (frame) f.dy = (f.dy || 0) - step; else pa.def.y -= step; break;
      case 'KeyI': if (frame) f.dy = (f.dy || 0) + step; else pa.def.y += step; break;
      // Size is a property of the animation, not of a frame: every frame is derived from frame 0's
      // height at one units-per-pixel, so this rescales them together and keeps them in proportion.
      // A 'swap' has no sprite of its own — its size comes from the art it repaints the prop with,
      // so there is nothing here to resize.
      case 'KeyU': if (pa.def.mode !== 'swap') { pa.def.h = Math.max(1, pa.def.h * (e.shiftKey ? 0.8 : 0.97)); pa.upp = pa.def.h / pa.def.frames[0].px[1]; } break;
      case 'KeyO': if (pa.def.mode !== 'swap') { pa.def.h = pa.def.h * (e.shiftKey ? 1.25 : 1.03); pa.upp = pa.def.h / pa.def.frames[0].px[1]; } break;
      // How far a 'rise' sprite climbs. Worth being able to see both ends: too little and it never
      // clears the prop's outline, too much and it launches off the top.
      // …and how far a 'chug' gains per beat, which is the same knob by another name.
      case 'BracketLeft':
        if (pa.def.mode === 'rise') pa.def.travel = Math.max(0, pa.def.travel - step);
        else if (pa.def.mode === 'chug') pa.def.rise = Math.max(0, pa.def.rise - step);
        break;
      case 'BracketRight':
        if (pa.def.mode === 'rise') pa.def.travel += step;
        else if (pa.def.mode === 'chug') pa.def.rise += step;
        break;
      case 'KeyN': frame = (frame + steps(pa) - 1) % steps(pa); break;
      case 'KeyM': frame = (frame + 1) % steps(pa); break;
      case 'Comma':  sel = (sel + propAnims.length - 1) % propAnims.length; frame = 0; break;
      case 'Period': sel = (sel + 1) % propAnims.length; frame = 0; break;
      // Pin every sprite fully out, so placement can be done from the overview camera rather than
      // by standing in exactly the right spot in third person.
      case 'KeyP': animPinned = !animPinned; break;
      case 'KeyC': {
        const text = dump();
        // Log unconditionally — a clipboard write can be refused (unfocused tab, insecure origin)
        // and losing a placement pass to that would be maddening.
        console.log(text);
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text)
            .then(() => { hud.style.borderColor = '#f2872e'; setTimeout(() => hud.style.borderColor = '#454545', 400); })
            .catch(() => console.warn('clipboard refused — copy the table logged above instead'));
        }
        break;
      }
      default: touched = false;
    }
    if (touched) apply();
  });

  apply();
}

// Wind-gust streaks — hand-drawn gust lines that ride the gust front across the scene. Build a small
// pool of camera-facing planes (so the 2D line always reads), alternating the two streak PNGs.
function setupFloaters() {
  for (let i = 0; i < STREAK_POOL; i++) {
    const def = FLOAT_PNGS[i % FLOAT_PNGS.length];
    const tex = new BABYLON.Texture(def.url, scene, false, true, undefined, null, () => console.warn('streak PNG failed:', def.url));
    tex.hasAlpha = true;
    const mat = new BABYLON.StandardMaterial('streakMat' + i, scene);
    mat.diffuseColor = new BABYLON.Color3(0, 0, 0);
    mat.emissiveTexture = tex; mat.emissiveColor = new BABYLON.Color3(1, 1, 1);   // fullbright ink line
    mat.opacityTexture = tex;
    mat.specularColor = new BABYLON.Color3(0, 0, 0);
    mat.backFaceCulling = false; mat.disableLighting = true;
    mat.transparencyMode = BABYLON.Material.MATERIAL_ALPHABLEND;
    const mesh = BABYLON.MeshBuilder.CreatePlane('streak' + i, { width: STREAK_SIZE * def.aspect, height: STREAK_SIZE }, scene);
    mesh.material = mat;
    mesh.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
    mesh.isPickable = false; mesh.setEnabled(false);
    floaters.push({ mesh, active: false });
  }
}
// On each gust, send one streak riding the gust front across the island at a random height.
function spawnStreak(g) {
  const s = floaters.find(o => !o.active);
  if (!s) return;
  s.t0 = g.t0; s.dur = g.dur; s.dirx = g.dirx; s.dirz = g.dirz;
  s.fStart = g.fStart; s.span = g.span;
  s.projC = islandCX * g.dirx + islandCZ * g.dirz;     // island centre's projection along the gust dir
  s.across = _rand(-0.4, 0.4) * islandR;               // across-wind offset
  s.y = _rand(STREAK_Y_MIN, STREAK_Y_MAX);             // varied height each gust
  s.active = true; s.mesh.setEnabled(true); s.mesh.visibility = 0;
}
// Bodies the camera collision ray should ignore — ground and all walkable platforms.
// Populated by reference at PhysicsAggregate creation so name lookups aren't needed.
const excludedCamBodies = new Set();
// Mesh references excluded from camera pickWithRay — ground and walkable platforms.
const excludedCamMeshes = new Set();
const keys = {};

// ─── Load farm ────────────────────────────────────────────────────────────────
BABYLON.SceneLoader.ImportMesh('', 'https://static.wixstatic.com/3d/', '863c39_f1d9ec0294a841e180fe527933311c18.glb', scene, (meshes) => {
  console.log('farm GLB loaded, meshes:', meshes.length);
  for (const m of meshes) {
    if (m.name === 'ground_plane') { groundMesh = m; break; }
  }
  console.log('checkpoint 1 - ground mesh:', groundMesh ? 'found' : 'not found');

  for (const m of meshes) {
    if (!m.getTotalVertices || m.getTotalVertices() === 0) continue;
    // Keep only the ground plane from the farm GLB — strip the barn, props, windmill, etc.
    if (m.name !== 'ground_plane') { m.dispose(); continue; }
    m.material = (m.name === 'ground_plane') ? groundMat : (m.name === 'pumpkin') ? pumpkinMat : whiteMat;
    m.receiveShadows = true;
    if (m.name !== 'ground_plane') shadowGen.addShadowCaster(m);
    if (m.name !== 'ground_plane') {
      m.enableEdgesRendering(0.95);
      m.edgesWidth = 55;   // bolder lines — thin lines undersample at distance and stipple into
                           // dashes; thicker rasterizes solid. Tune to taste in the browser.
      m.edgesColor = new BABYLON.Color4(0.02, 0.02, 0.02, 1);
    }
    m.checkCollisions = true;
    m.isPickable      = true;
    if (m.name === 'windmill_blades') windmillBlades = m;
    if (m.name === 'barn') barnMesh = m;

    if (scene.getPhysicsEngine()) {
      try {
        const shapeType = (
          m.name === 'ground_plane'      ||
          m.name === 'barn_second_floor' ||
          m.name === 'stepladder'
        ) ? BABYLON.PhysicsShapeType.BOX : BABYLON.PhysicsShapeType.MESH;
        const agg = new BABYLON.PhysicsAggregate(m, shapeType, { mass: 0, friction: 0.5, restitution: 0 }, scene);
        if (KINEMATIC_PLATFORMS.has(m.name)) {
          agg.body.setMotionType(BABYLON.PhysicsMotionType.ANIMATED);
          excludedCamBodies.add(agg.body);
          excludedCamMeshes.add(m);
        }
        if (m.name === 'ground_plane') {
          groundPhysicsBody = agg.body;
          excludedCamBodies.add(agg.body);
          excludedCamMeshes.add(m);
        }
      } catch (e) {
        console.warn('PhysicsAggregate skipped for', m.name, e);
      }
    }
  }
  console.log('checkpoint 2 - mesh loop done');

  if (groundMesh) {
    const positions = groundMesh.getVerticesData(BABYLON.VertexBuffer.PositionKind);
    const indices   = groundMesh.getIndices();
    if (positions && indices) {
      // ── Replace the heightfield with smooth procedural rolling mounds ─────────
      // The source ground is near-flat with isolated noise spikes (no real mounds),
      // so smoothing alone just flattens it. Instead we rewrite each vertex's Y from
      // smooth value-noise fBm — varied mounds & dips with no sharp points. Only Y is
      // touched (XZ fixed → footprint unchanged); the field is centered on the original
      // ground level so mounds rise above and dips fall below it.
      const vCount = positions.length / 3;
      // Deterministic value noise (hash → bilinear smoothstep interp) + 4-octave fBm.
      const hash = (i, j) => {
        let n = (i * 374761393 + j * 668265263) | 0;
        n = (n ^ (n >> 13)); n = (n * 1274126177) | 0;
        return ((n ^ (n >> 16)) >>> 0) / 4294967295;
      };
      const vnoise = (x, z) => {
        const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
        const u = xf * xf * (3 - 2 * xf), w = zf * zf * (3 - 2 * zf);
        const a = hash(xi, zi),     b = hash(xi + 1, zi);
        const c = hash(xi, zi + 1), d = hash(xi + 1, zi + 1);
        return (a * (1 - u) + b * u) * (1 - w) + (c * (1 - u) + d * u) * w;
      };
      const fbm = (x, z) => {
        let s = 0, amp = 0.5, f = 1;
        for (let o = 0; o < 4; o++) { s += amp * (vnoise(x * f, z * f) * 2 - 1); f *= 2; amp *= 0.5; }
        return s;
      };
      // Find the XZ extent so the noise frequency is independent of the mesh's scale.
      let xMin = Infinity, xMax = -Infinity, zMin = Infinity, zMax = -Infinity;
      for (let v = 0; v < vCount; v++) {
        const x = positions[v * 3], z = positions[v * 3 + 2];
        if (x < xMin) xMin = x; if (x > xMax) xMax = x;
        if (z < zMin) zMin = z; if (z > zMax) zMax = z;
      }
      const xSpan = (xMax - xMin) || 1, zSpan = (zMax - zMin) || 1;
      const raw = new Float32Array(vCount);
      let mean = 0;
      for (let v = 0; v < vCount; v++) {
        const u = (positions[v * 3] - xMin) / xSpan, w = (positions[v * 3 + 2] - zMin) / zSpan;
        raw[v] = fbm(u * GROUND_MOUND_FREQ, w * GROUND_MOUND_FREQ);
        mean += raw[v];
      }
      mean /= vCount;
      let peak = 0;
      for (let v = 0; v < vCount; v++) { raw[v] -= mean; if (Math.abs(raw[v]) > peak) peak = Math.abs(raw[v]); }
      peak = peak || 1;

      // ── Flatten a pad under each object at its own base height ────────────────
      // The props are spread across the terrain at varying base heights (they were authored on
      // the old bumpy ground). Build one "pad" per ground-level object: its world-XZ centre, a
      // radius from its footprint, and the local-Y that puts the terrain top at the object's
      // base. The world matrix still has the [2500,1,2500] scale here; its origin gives the
      // local↔world Y offset (local Y 0 → groundOriginY in world).
      groundMesh.computeWorldMatrix(true);
      const wm = groundMesh.getWorldMatrix();
      const tmp = new BABYLON.Vector3();
      const groundOriginY = BABYLON.Vector3.TransformCoordinates(BABYLON.Vector3.Zero(), wm).y;
      const smooth = (a, b, d) => { const t = Math.min(1, Math.max(0, (d - a) / (b - a))); return t * t * (3 - 2 * t); };
      const pads = [];
      for (const m of meshes) {
        if (m === groundMesh || !m.getTotalVertices || m.getTotalVertices() === 0) continue;
        m.computeWorldMatrix(true);
        const bb = m.getBoundingInfo().boundingBox;
        const baseY = bb.minimumWorld.y;
        if (baseY > PAD_MAX_BASE_Y) continue;   // skip elevated props (barn loft, roof, blades)
        pads.push({
          cx: (bb.minimumWorld.x + bb.maximumWorld.x) / 2,
          cz: (bb.minimumWorld.z + bb.maximumWorld.z) / 2,
          r:  0.5 * Math.max(bb.maximumWorld.x - bb.minimumWorld.x, bb.maximumWorld.z - bb.minimumWorld.z) * PAD_MARGIN,
          localY: baseY - groundOriginY,       // terrain top here = object base in world
        });
      }
      // A few LARGE rolling hills, organically dispersed near the blob's EDGES. Positions are in
      // normalized footprint space (0..1, centre 0.5,0.5); radius ~0.34–0.39 keeps them out near
      // the rim so the middle stays flatter. amp = peak height (world units), r = footprint-fraction width.
      const HILLS = [
        { u: 0.5 + 0.36 * Math.cos(0.4), w: 0.5 + 0.36 * Math.sin(0.4), amp: 230, r: 0.15 },
        { u: 0.5 + 0.38 * Math.cos(1.7), w: 0.5 + 0.38 * Math.sin(1.7), amp: 180, r: 0.13 },
        { u: 0.5 + 0.34 * Math.cos(2.9), w: 0.5 + 0.34 * Math.sin(2.9), amp: 260, r: 0.17 },
        { u: 0.5 + 0.39 * Math.cos(4.1), w: 0.5 + 0.39 * Math.sin(4.1), amp: 200, r: 0.14 },
        { u: 0.5 + 0.35 * Math.cos(5.3), w: 0.5 + 0.35 * Math.sin(5.3), amp: 210, r: 0.16 },
      ];
      for (let v = 0; v < vCount; v++) {
        tmp.copyFromFloats(positions[v * 3], 0, positions[v * 3 + 2]);
        const wp = BABYLON.Vector3.TransformCoordinates(tmp, wm);
        const rolling = (raw[v] / peak) * GROUND_MOUND_AMP;
        // Large edge hills (smooth Gaussian bumps in normalized XZ space).
        const nu = (positions[v * 3] - xMin) / xSpan, nw = (positions[v * 3 + 2] - zMin) / zSpan;
        let hills = 0;
        for (let hh = 0; hh < HILLS.length; hh++) {
          const h = HILLS[hh], du = nu - h.u, dw = nw - h.w;
          hills += h.amp * Math.exp(-(du * du + dw * dw) / (2 * h.r * h.r));
        }
        let w = 0, padY = 0;                    // strongest-influence pad wins
        for (let p = 0; p < pads.length; p++) {
          const pad = pads[p];
          const inf = 1 - smooth(pad.r, pad.r + PAD_FALLOFF, Math.hypot(wp.x - pad.cx, wp.z - pad.cz));
          if (inf > w) { w = inf; padY = pad.localY; }
        }
        positions[v * 3 + 1] = (rolling + hills) * (1 - w) + padY * w;
      }

      // Bake the mesh's own scaling into the vertices, then reset it to 1. The ground node is
      // scaled [2500, 1, 2500]; while that non-uniform scale is live, Babylon transforms the
      // local normals by its inverse-transpose (1/2500, 1, 1/2500), which collapses every
      // normal to ~straight-up and erases all slope shading (the surface rolls but renders flat
      // grey). Baking makes the geometry uniformly scaled so ComputeNormals — and the renderer —
      // get correct world normals. World position is unchanged (rotation is identity here).
      const sx = groundMesh.scaling.x, sy = groundMesh.scaling.y, sz = groundMesh.scaling.z;
      for (let v = 0; v < vCount; v++) {
        positions[v * 3]     *= sx;
        positions[v * 3 + 1] *= sy;
        positions[v * 3 + 2] *= sz;
      }
      groundMesh.scaling.copyFromFloats(1, 1, 1);

      // ── Carve a smooth organic (blob) outline out of the square footprint ──────
      // Keep only geometry inside an angle-varying radius r(θ) = R0·baseR·(1 + amp·lobes).
      // Triangles fully outside are dropped; triangles that straddle the edge keep their
      // outside vertices but project them radially onto r(θ), so the rim IS the smooth curve.
      const BLOB_R0  = 0.80;   // AVERAGE coast radius as a fraction of the half-extent (leaves room for peninsulas)
      const BLOB_AMP = 0.24;   // coastline depth — how far bays cut in / peninsulas push out (×normalized noise ±1)
      let cutIndices = indices;
      {
        let bx0 = Infinity, bx1 = -Infinity, bz0 = Infinity, bz1 = -Infinity;
        for (let v = 0; v < vCount; v++) {
          const x = positions[v * 3], z = positions[v * 3 + 2];
          if (x < bx0) bx0 = x; if (x > bx1) bx1 = x; if (z < bz0) bz0 = z; if (z > bz1) bz1 = z;
        }
        const cx = (bx0 + bx1) / 2, cz = (bz0 + bz1) / 2;
        const baseR = Math.min((bx1 - bx0) / 2, (bz1 - bz0) / 2);
        // Multi-octave angular noise → irregular natural COASTLINE (broad bays + smaller inlets +
        // peninsulas). Integer harmonics keep it periodic in θ (closed loop, no seam). Normalized
        // by the coefficient sum (1.42) so BLOB_AMP maps to ±fraction of the average radius.
        const radiusAt = (a) => baseR * BLOB_R0 * (1 + BLOB_AMP * (
            0.50 * Math.sin(a *  2 + 0.7) + 0.34 * Math.sin(a *  3 - 1.3) +
            0.24 * Math.sin(a *  5 + 2.1) + 0.16 * Math.sin(a *  7 - 0.5) +
            0.11 * Math.sin(a * 11 + 1.7) + 0.07 * Math.sin(a * 17 + 0.3)
          ) / 1.42);
        const inside = new Uint8Array(vCount);
        for (let v = 0; v < vCount; v++) {
          const dx = positions[v * 3] - cx, dz = positions[v * 3 + 2] - cz;
          const r = radiusAt(Math.atan2(dz, dx));
          inside[v] = (dx * dx + dz * dz) <= r * r ? 1 : 0;
        }
        const projected = new Uint8Array(vCount);
        const keep = [];
        for (let t = 0; t < indices.length; t += 3) {
          const a = indices[t], b = indices[t + 1], c = indices[t + 2];
          if (!inside[a] && !inside[b] && !inside[c]) continue;   // fully outside → drop
          keep.push(a, b, c);
          for (const vi of [a, b, c]) {
            if (!inside[vi] && !projected[vi]) {                  // pull rim vertices onto the curve
              const dx = positions[vi * 3] - cx, dz = positions[vi * 3 + 2] - cz;
              const ang = Math.atan2(dz, dx), d = Math.hypot(dx, dz) || 1, r = radiusAt(ang);
              positions[vi * 3]     = cx + dx / d * r;
              positions[vi * 3 + 2] = cz + dz / d * r;
              projected[vi] = 1;
            }
          }
        }
        cutIndices = keep;
        console.log('ground blob: kept', keep.length / 3, 'of', indices.length / 3, 'triangles');
      }

      // setVerticesData (not updateVerticesData) — glTF buffers import non-updatable, so
      // updateVerticesData would silently no-op. The 3rd arg marks it updatable.
      groundMesh.setVerticesData(BABYLON.VertexBuffer.PositionKind, positions, true);
      groundMesh.setIndices(cutIndices);

      // Recompute normals so the shading follows the new surface. ComputeNormals derives
      // direction from triangle winding, and this glTF's winding (right-handed source →
      // Babylon's left-handed space) yields DOWNWARD normals — so the top face is lit from
      // below and renders as flat ambient grey. Detect that (mean normal Y < 0) and flip.
      const newNormals = [];
      BABYLON.VertexData.ComputeNormals(positions, cutIndices, newNormals);
      let nySum = 0;
      for (let i = 1; i < newNormals.length; i += 3) nySum += newNormals[i];
      if (nySum < 0) for (let i = 0; i < newNormals.length; i++) newNormals[i] = -newNormals[i];
      groundMesh.setVerticesData(BABYLON.VertexBuffer.NormalKind, newNormals);
      groundMesh.refreshBoundingInfo();
      // Index the finished terrain for ray picking. Without this every pickWithRay against the
      // ground is a brute-force sweep of the whole heightfield, and this mesh is picked constantly:
      // twice per decorative piece at load, and by the prop seating besides. An octree turns each
      // of those from "test every triangle" into "test the few in the right box". Built here, at
      // the end, because it indexes the geometry as it stands — rebuilding the vertices after this
      // would leave the tree describing a surface that no longer exists.
      groundMesh.createOrUpdateSubmeshesOctree(64, 2);
    }
    // Island bounds for the wind floaters (centre + radius of the blob).
    const gbb = groundMesh.getBoundingInfo().boundingBox;
    islandCX = (gbb.minimumWorld.x + gbb.maximumWorld.x) / 2;
    islandCZ = (gbb.minimumWorld.z + gbb.maximumWorld.z) / 2;
    islandR  = 0.5 * Math.max(gbb.maximumWorld.x - gbb.minimumWorld.x, gbb.maximumWorld.z - gbb.minimumWorld.z);
    islandFloorY = gbb.minimumWorld.y;   // anything well below this means the player fell off

    // setupFloaters();   // wind-gust streak PNGs — disabled for now
  }
  console.log('checkpoint 3 - terrain smoothed, normals done');

  const sceneBB = computeSceneBounds(meshes);
  const ctr = sceneBB.center, sz = sceneBB.size;
  const dim = Math.max(sz.x, sz.y, sz.z);
  sun.shadowMinZ = -dim * 2;
  sun.shadowMaxZ = dim * 2;

  isoCamera.target = new BABYLON.Vector3(islandCX, groundMesh.getBoundingInfo().boundingBox.centerWorld.y, islandCZ);   // look at the 3D farm
  isoCamera.alpha  = Math.PI * 1.75;   // orbit so the scene reads upright (±π/2 to spin it 90°)
  isoCamera.beta   = Math.PI / 3;      // looking down at the farm
  isoCamera.radius = islandR * 3.8;    // zoomed out so the whole island sits in frame
  _isoOrigPose = {
    target: isoCamera.target.clone(),
    alpha:  isoCamera.alpha,
    beta:   isoCamera.beta,
    radius: isoCamera.radius,
  };
  console.log('checkpoint 4 - cameras fit, loading player...');

  // Load player mesh and spawn tpCamera
  BABYLON.SceneLoader.ImportMesh('', 'https://static.wixstatic.com/3d/', '863c39_d78870260f514a8abe5c8b22bbecb990.glb', scene, (pMeshes) => {
    console.log('player GLB loaded, meshes:', pMeshes.length);
    const realMesh = pMeshes.find(m => m.getTotalVertices && m.getTotalVertices() > 0);
    if (!realMesh) { console.error('no vertices found in player GLB'); onReady(); return; }
    console.log('realMesh found:', realMesh.name);

    // Stand the model upright (it's exported lying on its back)
    realMesh.setParent(null);
    if (realMesh.rotationQuaternion) {
      realMesh.rotation = realMesh.rotationQuaternion.toEulerAngles();
      realMesh.rotationQuaternion = null;
    }
    realMesh.rotation = new BABYLON.Vector3(Math.PI / 2, 0, 0);

    // Scale to PLAYER_HEIGHT
    realMesh.computeWorldMatrix(true);
    const bb0 = realMesh.getBoundingInfo().boundingBox;
    const modelH = bb0.maximumWorld.y - bb0.minimumWorld.y;
    const s = PLAYER_HEIGHT / modelH;
    realMesh.scaling = new BABYLON.Vector3(s, s, s);

    // Parent to tpCamera — mesh will move/rotate with the camera
    realMesh.parent = tpCamera;

    // Offset so feet sit at tpCamera's origin. NOTE: the collision ellipsoid actually rests
    // ~ellipsoid.y ABOVE the ground, so feet pinned to the origin would hover — the render loop
    // re-plants them on the real terrain each frame (see tpFeetBaseY usage below).
    realMesh.computeWorldMatrix(true);
    const bb1 = realMesh.getBoundingInfo().boundingBox;
    realMesh.position.y -= bb1.minimumWorld.y - tpCamera.position.y;
    tpFeetBaseY = realMesh.position.y;   // baseline: feet at the camera origin
    charBaseS = s; charBaseFeetY = tpFeetBaseY;   // remember base scale/offset for per-mode resizing

    // Make the player read lighter & more colourful against the bright paper-white scene:
    // its PBR material gets no ambient fill, so emit a fraction of its own albedo (orange)
    // texture. Also raise the light limit so the player orb lights it alongside sun/hemi/fill.
    const pm = realMesh.material;
    if (pm) {
      if (pm.albedoTexture && 'emissiveColor' in pm) {
        pm.emissiveTexture = pm.albedoTexture;   // emit its own colour, not flat white
        pm.emissiveColor   = new BABYLON.Color3(PLAYER_EMISSIVE, PLAYER_EMISSIVE, PLAYER_EMISSIVE);
      }
      pm.maxSimultaneousLights = 5;
    }

    shadowGen.addShadowCaster(realMesh);
    tpMesh = realMesh;

    // Spawn close to the barn (island centre), facing it, kept well inside the coastline so the
    // player doesn't start on an edge. Try farther→nearer and stop at the first point still on the
    // island (so it doesn't spawn off a coastline bay).
    const spawnX = islandCX;
    let spawnZ = islandCZ + islandR * 0.25, groundY = 0;
    for (let t = 0.45; t >= 0.15; t -= 0.05) {
      const z = islandCZ + islandR * t;
      const hit = scene.pickWithRay(
        new BABYLON.Ray(new BABYLON.Vector3(spawnX, 5000, z), new BABYLON.Vector3(0, -1, 0), 10000),
        m => m === groundMesh);
      if (hit && hit.hit) { spawnZ = z; groundY = hit.pickedPoint.y; break; }
    }
    // Spawn the collision body at its natural RESTING height (origin sits ~ellipsoid.y above ground);
    // the visible mesh feet are re-planted on the ground each frame, so this doesn't look like a float.
    tpCamera.position = new BABYLON.Vector3(spawnX, groundY + tpCamera.ellipsoid.y, spawnZ);
    tpCamera.rotation.y = Math.PI;   // face -Z, toward the props at the island centre
    spawnPoint = tpCamera.position.clone();   // remembered for respawn after falling off
    console.log('player spawned at', tpCamera.position.toString(), 'groundY:', groundY);

    // ─── Scene props — barn in the centre, others scattered around it per the reference sketch ───
    // Offsets are fractions of R, so the whole layout scales with the island. All are 'paper'
    // (wind-rippling) posters facing +Z (toward the player's start), each slightly tilted about Z
    // for dimensional variety.
    // Left/right: +X is the viewer's left (sketch left). If it reads mirrored, flip the X signs.
    // Keep every prop inside ~0.80·R of the centre: the coastline is a blob whose radius dips to
    // roughly 0.6·islandR (= 0.8·R) in the bays, and a prop placed past it finds no ground under
    // the seating raycast and falls back to y = 0 (floating or buried). The tractor sits past that
    // at 0.95·R because the reference screenshot puts it there, on a headland rather than a bay --
    // if the blob's shape is ever re-rolled, that is the first prop to re-check.
    const R = islandR * 0.75;   // spread — distance of props from centre (smaller = closer together)

    // ONE world scale for the whole prop set. The art is all drawn to a common scale, so each
    // prop's height falls out of its own art height in pixels — that is what keeps them in
    // proportion to each other. The barn anchors it: its art is 2806 px tall and reads at 320
    // world units (the size we want to keep), hence 320/2806 units per art-pixel.
    // px[] is the size of the ORIGINAL delivered art (kept in interactive-assets/_originals),
    // deliberately NOT the size of the downscaled file we actually ship — so re-exporting at a
    // different resolution can never silently change how big a prop reads in-game.
    // fx: true gives a prop the wake-up effect on approach (ink darkens & thickens, sheet lifts
    // off the ground). Currently the barn only, while we settle on the look — every prop still
    // gets a proximity ramp regardless, so switching one on is a one-word edit here.
    const ART_UNITS_PER_PX = 320 / 2806;
    const PROP_DIR = 'sceneAssets/interactive-assets/';
    const SCENE_PROPS = [
      // The barn anchors the layout at the centre; the rest are fanned out around it on distinct
      // bearings at varied radii, so no two read as a clump from any approach angle. The current
      // spots for tractor / wheelBarrow / toxicBarrels come from the 2026-08-20 marked-up overview
      // screenshot — each was read off the circle drawn on that render. The coast spot on that
      // screenshot was drawn for routeCellar, but the haystack stands there now: the two swapped
      // places, so routeCellar took the haystack's old spot in closer to the barn.
      // name              file                    art px         x·R      z·R    tilt      fx
      { name:'barn',         file:'barn.png',         px:[4033,2806], x: 0.00, z: 0.00, tilt: 0,     fx:true  },
      { name:'tree',         file:'tree.png',         px:[2308,3356], x: 0.37, z: 0.21, tilt: 0.03,  fx:false },
      { name:'haystack',     file:'haystack.png',     px:[ 943, 929], x:-0.60, z: 0.41, tilt:-0.04,  fx:false },   // out toward the near-left coast
      { name:'routeCellar',  file:'routeCellar.png',  px:[1412, 576], x:-0.35, z:-0.19, tilt: 0.025, fx:false },   // in closer, round to the near-left of the barn
      { name:'tractor',      file:'tractor.png',      px:[1836,1287], x: 0.94, z:-0.12, tilt:-0.02,  fx:false },   // past the tree, out on the far-right shoulder — the widest prop in the set at 0.95·R
      { name:'wheelBarrow',  file:'wheelBarrow.png',  px:[1094, 639], x:-0.30, z: 0.72, tilt: 0.04,  fx:false },   // off the walk-in path to the left, out past the spawn point
      { name:'toxicBarrels', file:'toxicBarrels.png', px:[1079, 817], x: 0.31, z:-0.68, tilt:-0.03,  fx:false },   // round the back of the barn and further off, hidden on approach
      { name:'boat',         file:'boat.png',         px:[1935, 822], x:-0.42, z:-0.60, tilt: 0.05,  fx:false },   // out toward the coastline, beached
    ];
    const props = {}, propSize = {};
    for (const p of SCENE_PROPS) {
      const aspect = p.px[0] / p.px[1];
      const H = p.px[1] * ART_UNITS_PER_PX, W = H * aspect;
      propSize[p.name] = { W, H };
      props[p.name] = addGroundPng(PROP_DIR + p.file, {
        x: islandCX + p.x * R,  z: islandCZ + p.z * R,
        height: H, aspect, style: 'paper', tilt: p.tilt, fx: p.fx,
      });
    }

    // ─── Triggered prop animations ────────────────────────────────────────────────────────────
    // One sprite quad per animated prop, PARENTED TO THE PROP MESH. Parenting is the whole trick:
    // the prop's tilt, its wind lean and its wake-lift all carry the sprite along through the
    // parent's world matrix, so nothing here has to track the prop per frame. The arrows get their
    // anchors onto a moving prop the same way (a.target.getWorldMatrix() in updatePropArrows).
    //
    // Every frame's texture is built NOW rather than on first sight — the arrows load eagerly for
    // the same reason, and for the same effect: a lazy load would stall the pop the one time it
    // matters. Two 30-50 KB PNGs against art files a hundred times that size.
    for (const name in PROP_ANIM) {
      const def = PROP_ANIM[name], target = props[name], size = propSize[name];
      if (!target || !size) { console.warn('PROP_ANIM references unknown prop:', name); continue; }

      // `prop: true` on a frame means "the sheet the prop already has" — reuse that texture rather
      // than loading a second copy of art the scene has loaded once already.
      const texes = def.frames.map(f => {
        if (f.prop) return target.material.diffuseTexture;
        const t = new BABYLON.Texture(ANIM_DIR + f.file, scene, false, true, undefined, null,
          () => console.warn('prop animation PNG failed to load:', f.file));
        t.hasAlpha = true;
        return t;
      });

      // 'swap' repaints the PROP ITSELF rather than hanging a sprite on it, so there is no quad to
      // build, no material to make and no standoff to derive: it borrows the prop's own mesh and
      // material and just changes which sheet they wear. The cellar's two drawings are registered
      // for this — same width, same ink columns, same 54 px from canvas bottom to the lowest
      // stroke, the open one simply 188 px taller because the raised door needs headroom. So the
      // ground line, the grass and the little structure to the right all stay put and only the
      // door moves. Anchoring the trigger at the BASE (y = 0) matters: the mesh's verts run Y 0..H
      // from its origin, so the door-swap's vertical scaling pivots there and leaves that one
      // height untouched — anywhere else the anchor would rise as the door opened, changing the
      // very distance that decides whether it should be open, which can chatter at the threshold.
      if (def.mode === 'swap') {
        propAnims.push({
          name, def, mesh: target, mat: target.material, texes, target,
          W: size.W, H: size.H,
          local: new BABYLON.Vector3(def.x * size.W, def.y * size.H, 0),
          lift: 0, upp: 0, e: 0, chugT0: 0, frame: -1,
        });
        continue;
      }

      // Same material recipe as the props themselves (flat, self-lit paper) with ONE change:
      // alpha TEST rather than alpha blend. Blended geometry writes no depth and is ordered only
      // by sorting whole meshes on distanceToCamera, which is measured to the mesh's bounding
      // centre — so a squirrel a few units off a 383-unit tree would sort against the middle of
      // the TREE and could flip behind the trunk depending on the angle you walk in from. Alpha
      // testing puts the sprite in the opaque pass where the depth buffer resolves it per pixel
      // and sort order stops mattering. It is the same fix, for the same reason, as the
      // decorations below. Hard-edged line art takes the cutout well, and a hard two-frame
      // flipbook wants no fade anyway.
      const mat = new BABYLON.StandardMaterial('propAnimMat_' + name, scene);
      mat.diffuseTexture = texes[0]; mat.useAlphaFromDiffuseTexture = true;
      mat.emissiveTexture = texes[0]; mat.emissiveColor = new BABYLON.Color3(0.7, 0.7, 0.7);
      mat.specularColor = new BABYLON.Color3(0, 0, 0);
      mat.backFaceCulling = false;
      if (def.mode === 'chug') {
        // The puff is fully opaque like everything else — this is a DRAW-ORDER choice, not a
        // transparency effect. Alpha testing resolves a sprite against its prop with the depth
        // buffer, which is what the squirrel needs, but it costs a standoff wide enough to clear
        // the prop's paper ripple: at the tractor's pipe height that is ~23 units on a 209-wide
        // sheet, and the puff visibly swims in front of the tractor as you walk around it.
        // Blending with a pinned alphaIndex instead means the puff simply always draws after the
        // tractor, whatever the ripple does, so it can sit 3 units off the face. It also spends
        // three of its four beats above the tractor's outline against open sky, where there is
        // nothing to sort against at all.
        mat.transparencyMode = BABYLON.Material.MATERIAL_ALPHABLEND;
        mat.alphaIndex = 500;
      } else {
        mat.transparencyMode = BABYLON.Material.MATERIAL_ALPHATEST;
        mat.alphaCutOff = ANIM_ALPHA_CUTOFF;
      }

      // A unit quad — X -0.5..0.5, Y 0..1 — so scaling sets the frame's size and plants its
      // BASE-CENTRE on the anchor point, which is the registration the table's x/y describe.
      const mesh = buildVerticalPlane('propAnim_' + name, 1, 1, 1, 1);
      mesh.material = mat;
      mesh.parent = target;                    // inherit the prop's tilt, lean and lift
      mesh.isPickable = false;                 // never steal the prop's own click
      mesh.checkCollisions = false;            // and never block the player
      mesh.receiveShadows = true;              // but not a CASTER: transparencyShadow is costly
      mesh.setEnabled(false);
      excludedCamMeshes.add(mesh);             // the camera ray ignores it — no zoom-in on a squirrel

      const lift = propAnimLift(def, size.W);

      propAnims.push({
        name, def, mesh, mat, texes, target,
        W: size.W, H: size.H,
        // The point the proximity test measures to, in the prop's OWN sheet space — the knot-hole
        // rather than the trunk's foot, which on a 383-unit tree is 167 units lower and would trip
        // the animation from the wrong place. Transformed by the prop's world matrix each frame, so
        // the prop's tilt, lean and wake-lift carry it — the same thing arrows do with a.local.
        // Deliberately the animation's BASE anchor and not the current frame's: a per-frame dx/dy
        // nudge is a registration fix, and should not move where the trigger fires from.
        local: new BABYLON.Vector3(def.x * size.W, def.y * size.H, lift),
        lift,
        upp: def.h / def.frames[0].px[1],      // ONE units-per-pixel for the whole animation (sprites only)
        e: 0,                                  // emergence, 0..1 — the only state there is
        chugT0: 0,                             // 'chug' only: windT when the cycle last restarted
        frame: -1,                             // last frame applied, so we only re-texture on change
      });
    }
    if (ANIM_EDIT) setupPropAnimEditor();

    // ─── Decorations ──────────────────────────────────────────────────────────────────────────
    // ONE mesh per art file; every piece of that art is a THIN INSTANCE of it. Twelve meshes, twelve
    // draw calls, for however many hundred pieces are placed.
    //
    // This is the fix for the frame rate, and it was found by measuring rather than guessing. As 297
    // separate meshes the decorations cost ~22 ms of CPU every frame — half the frame budget — while
    // GPU time never moved: turning them off took draw calls 324 -> 27 and CPU 44 ms -> 21 ms. The
    // cost was never the pixels, the textures or the transparency. Babylon spends CPU per MESH per
    // frame on world matrices, material binding and uniform uploads, so the cost was simply the
    // NUMBER OF OBJECTS. Four earlier passes optimised everything except that.
    //
    // Thin instances rather than a plain merge, because merging would weld them into static geometry
    // and the sway would be gone. Each instance keeps its own transform, so each piece still leans in
    // the wind; the difference is that the whole group moves as one matrix buffer written and
    // uploaded once, instead of 297 meshes each doing their own per-frame bookkeeping.
    const DECOR_ART = {};
    for (const k of DECOR_KINDS) {
      for (const a of k.files) {
        DECOR_ART[a.file.replace('.png', '')] = { url: DECOR_DIR + a.file, ar: a.ar, style: k.style, h: k.h };
      }
    }
    const decorGroups = new Map();   // art key → { art, mesh, recs[], ys[], mats }

    const decorGroupFor = (key) => {
      let g = decorGroups.get(key);
      if (g) return g;
      const art = DECOR_ART[key];
      if (!art) { console.warn('DECOR_PLACED references unknown art:', key); return null; }
      const tex = new BABYLON.Texture(art.url, scene, false, true, undefined, null,
        () => console.warn('decoration PNG failed to load:', art.url));
      tex.hasAlpha = true;
      const mat = new BABYLON.StandardMaterial('decorMat_' + key, scene);
      mat.diffuseTexture = tex; mat.useAlphaFromDiffuseTexture = true;
      mat.emissiveTexture = tex; mat.emissiveColor = new BABYLON.Color3(0.7, 0.7, 0.7);
      mat.specularColor = new BABYLON.Color3(0, 0, 0);
      mat.backFaceCulling = false;
      // Alpha TEST, not alpha blend — and this is about CORRECTNESS, not speed. As a performance
      // measure it was tried and measured worthless (GPU unmoved, CPU slightly up), because the
      // thin-instance rewrite had already removed the sorting and overdraw it would have saved.
      //
      // But that same rewrite introduced a depth bug that only alpha testing fixes. Babylon writes
      // depth for opaque materials ONLY (`setDepthWrite(alphaMode === ALPHA_DISABLE)`), so blended
      // geometry is ordered purely by sorting transparent meshes on distanceToCamera. Every piece of
      // one art file now shares ONE mesh, whose bounds span the island — so the whole group carries a
      // single sort key of roughly "the middle of the map". Land that nearer than the barn and every
      // instance draws over it, including the ones plainly behind it. Before instancing each piece
      // was its own mesh with its own distance, which is why this never happened then.
      //
      // Alpha testing puts them in the OPAQUE pass, where the depth buffer resolves each piece per
      // pixel and sort order stops mattering — the same reason engines cut out foliage rather than
      // blending it. `discard` also means fully transparent texels write no depth, which is what
      // rules out simply forcing depth writes on a blended material: the empty margin of a sheet
      // would occlude whatever sits behind its rectangle.
      //
      // The usual cost is a harder edge, largely absorbed here by rendering at 2.5x and downsampling.
      mat.transparencyMode = BABYLON.Material.MATERIAL_ALPHATEST;
      mat.alphaCutOff = DECOR_ALPHA_CUTOFF;
      // A unit quad, X -0.5..0.5 and Y 0..1, so an instance matrix scales it to size and plants its
      // BASE on the ground point — the same anchoring the per-piece pivot used to provide.
      const mesh = buildVerticalPlane('decor_' + key, 1, 1, 1, 1);
      mesh.material = mat;
      mesh.receiveShadows = true;        // but never a shadow CASTER: transparencyShadow is costly
      mesh.checkCollisions = false;      // walk straight through scenery
      mesh.isPickable = DECOR_EDIT;       // only the decoration editor ever needs to hit one
      mesh.thinInstanceEnablePicking = DECOR_EDIT;
      excludedCamMeshes.add(mesh);       // the camera ray ignores decoration
      g = { key, art, mesh, recs: [], ys: [], mats: null };
      decorGroups.set(key, g);
      return g;
    };

    // Scratch objects, reused across every instance of every frame — allocating a Vector3 per piece
    // per frame would hand the garbage collector 300 objects a frame to clean up.
    const _dS = new BABYLON.Vector3(), _dP = new BABYLON.Vector3();
    const _dQ = new BABYLON.Quaternion(), _dM = new BABYLON.Matrix();

    // Compose one matrix per piece: scale to its size, tilt by its own lean, plant it on the ground.
    // `wind` is null at build time (rest pose) and supplied each frame while swaying.
    const decorWriteMatrices = (g, wind) => {
      const n = g.recs.length;
      if (!g.mats || g.mats.length !== n * 16) g.mats = new Float32Array(n * 16);
      for (let i = 0; i < n; i++) {
        const r = g.recs[i];
        const x = islandCX + r.x * R, z = islandCZ + r.z * R;
        let pitch = 0;
        if (wind) {
          const w = getWind(windT, x, z);
          // Same model as the props' 'lean': tip downwind about the base, with a per-piece flutter
          // so a gust does not move the whole island in lockstep.
          const flutter = 0.7 + 0.5 * Math.sin(windT * 2.0 + i * 1.7)
                              + 0.2 * Math.sin(windT * 3.3 + i * 2.9);
          pitch = w.strength * LEAN_GAIN * flutter * w.dz;
        }
        _dS.set(r.h * g.art.ar, r.h, 1);
        _dP.set(x, g.ys[i], z);
        BABYLON.Quaternion.RotationYawPitchRollToRef(0, pitch, r.t, _dQ);
        BABYLON.Matrix.ComposeToRef(_dS, _dQ, _dP, _dM);
        _dM.copyToArray(g.mats, i * 16);
      }
    };

    const decorApply = (g) => {
      // Deleting the last piece of an art file leaves a zero-length buffer, which is not something to
      // hand Babylon — drop the instance count to nothing instead and leave the mesh dormant.
      if (!g.recs.length) { g.mesh.thinInstanceCount = 0; return; }
      g.mesh.thinInstanceSetBuffer('matrix', g.mats, 16, false);   // false → the buffer stays writable
      g.mesh.thinInstanceRefreshBoundingInfo(true);
    };
    const decorRebuild = (g) => { decorWriteMatrices(g, null); decorApply(g); };

    // Seat a piece on the terrain and add it to its group. The ground probe happens once, here, and
    // the answer is kept in g.ys — a per-frame raycast for scenery that never moves would be absurd.
    const decorAdd = (rec) => {
      const g = decorGroupFor(rec.f);
      if (!g) return null;
      const x = islandCX + rec.x * R, z = islandCZ + rec.z * R;
      const ray = new BABYLON.Ray(new BABYLON.Vector3(x, 5000, z), new BABYLON.Vector3(0, -1, 0), 10000);
      const hit = scene.pickWithRay(ray, m => m === groundMesh);
      g.recs.push(rec);
      g.ys.push((hit && hit.hit) ? hit.pickedPoint.y : 0);
      return g;
    };

    if (!NO_DECOR) {
      for (const rec of DECOR_PLACED) decorAdd(rec);
      for (const g of decorGroups.values()) decorRebuild(g);
      // One matrix-buffer rewrite per art file per frame, in place of 297 meshes' worth of per-mesh
      // work. Runs in both modes, so the sway reads from the overview as well as on the ground.
      //
      // …but only while there is actually wind. Gusts are intermittent by design (a few seconds of
      // blowing, then 3-10s of calm — see updateWind), and between them every piece is upright and
      // every matrix identical to the one already in the buffer. Rewriting 297 of them to say
      // "unchanged" is pure waste. Write the rest pose ONCE when a gust dies, then go quiet until
      // the next one starts.
      let decorAtRest = false;
      updateDecorSway = () => {
        if (!windGust.active) {
          if (decorAtRest) return;                 // already upright and already uploaded
          decorAtRest = true;
          for (const g of decorGroups.values()) {
            if (!g.recs.length) continue;
            decorWriteMatrices(g, null);           // null wind = rest pose
            g.mesh.thinInstanceBufferUpdated('matrix');
          }
          return;
        }
        decorAtRest = false;
        for (const g of decorGroups.values()) {
          if (!g.recs.length) continue;
          decorWriteMatrices(g, true);
          g.mesh.thinInstanceBufferUpdated('matrix');
        }
      };
    }
    console.log('decorations:', DECOR_PLACED.length, 'pieces in', decorGroups.size,
                'draw calls' + (EDIT_MODE ? ' — editor ON' : ''));

    if (DECOR_EDIT) setupDecorEditor({ DECOR_ART, decorGroups, decorAdd, decorRebuild });

    const barnProp = props.barn;
    // ─── Prop links ───────────────────────────────────────────────────────────────────────────
    // Triggered by CLICK only (the old proximity/collision trigger is gone). A linked prop is
    // clickable from any range you can see it at — no proximity gate, so the pointing hand can
    // promise a click anywhere the prop is on screen. Third person only, though: the overview is
    // a map, and clicking a prop from up there does nothing (see pickAction below).
    //
    // An action is either { popup: '<videoAssets folder>' } — the floating photo grid built by
    // openPhotoPopup() out of VIDEO_COLLECTIONS — or { url, newTab } for a plain link out.
    // The barn is the one prop routed per-spot rather than as a whole sheet, so its action hangs
    // off barnSpots below; every other prop takes its action straight from this table.
    // Still unspoken for, if more props ever want one: Just Borg, Nick At Home, Rojo.
    // (The flying egg goes to a single Just Borg video by URL — see FLY_PNGS up top — so the folder
    // itself is still free for a prop that wants the whole grid.)
    // (Make A Joyful Noise is spoken for — it hangs off the barn's cupola, in barnSpots below.)
    const PROP_ACTIONS = {
      boat:         { popup: 'Vote Mail Is Easy' },
      haystack:     { popup: 'Nonprofits' },
      routeCellar:  { url: 'https://siennabroglie.wixsite.com/my-site-1/works-in-progress' },
      toxicBarrels: { popup: 'Stay Home Safe Secure' },
      tractor:      { popup: 'Orange Man Adventure Theatre' },
      tree:         { popup: 'Mom My Straightman' },
      wheelBarrow:  { popup: 'Games' },
    };
    for (const [name, action] of Object.entries(PROP_ACTIONS)) {
      if (!props[name]) continue;
      // A null action is inert — nothing to click yet — but the prop still gets its arrow, so the
      // set reads as uniformly interactive while its link is outstanding.
      if (action) propLinks.push({ prop: props[name], action });
      const an = ARROW_ANCHORS[name] || ARROW_ANCHOR, size = propSize[name];
      addPropArrow(props[name], new BABYLON.Vector3(an.x * size.W, an.y * size.H, 0));
    }

    // Barn — a click is routed by the UV it hit to whichever spot's box contains it.
    // box = [u0,v0,u1,v1] in image UV, v measured DOWN from the top of the art.
    // Add more rows here to light up other features; each linked row gets its own arrow below.
    // Boxes are rectangles, so keep them tight to the feature — the cupola's stops below the
    // weathervane rather than swallowing the empty sky around the spire.
    const barnSpots = [
      { name: 'doors',  box: [0.57, 0.68, 0.78, 0.99], action: { popup: 'Trailers' } },
      { name: 'cupola', box: [0.32, 0.09, 0.45, 0.31], action: { popup: 'Make A Joyful Noise' } },
    ];
    // Point the pop-up arrow at the doors. Convert the spot's box centre from image UV into the
    // plane's own local space: u runs straight across (u=0 at x=-W/2), while the box's v runs DOWN
    // the image and the mesh's y runs UP from the base — hence the 1 - v.
    const spotAnchor = (box, size) => new BABYLON.Vector3(
      ((box[0] + box[2]) / 2 - 0.5) * size.W,
      (1 - (box[1] + box[3]) / 2) * size.H,
      0);
    // The barn is routed per-spot, so each linked spot gets its own arrow rather than one for the
    // whole sheet. One spot today; a second row in barnSpots would light up its own arrow for free.
    for (const bs of barnSpots) if (bs.action) addPropArrow(barnProp, spotAnchor(bs.box, propSize.barn));
    // One entry point for both action shapes, so the barn's spots and the whole-prop table stay
    // interchangeable — swapping either one between a popup and a link is a one-word edit.
    const runAction = (a) => {
      if (!a) return;
      if (a.popup) { openPhotoPopup(a.popup); return; }
      if (!a.url) return;
      if (a.newTab) window.open(a.url, '_blank'); else window.location.href = a.url;
    };
    // Catch a folder renamed on disk but not here (or vice versa) at load, not on the click.
    // FLY_PNGS is in the sweep too. Its only link today is a plain URL, which this check ignores —
    // but the field accepts a { popup } just as PROP_ACTIONS does, and a link that breaks only when
    // someone happens to click a passing egg breaks in front of a visitor rather than in front of us.
    for (const a of [...Object.values(PROP_ACTIONS), ...barnSpots.map(s => s.action),
                     ...FLY_PNGS.map(f => f.link)]) {
      if (a && a.popup && !VIDEO_COLLECTIONS[a.popup]) console.warn('prop popup has no videoAssets collection:', a.popup);
    }
    const resolveBarnSpot = (u, v) => {
      // ONE transform, not a search over flips. buildVerticalPlane lays v out running UP from the
      // plane's base while the boxes above are written v-DOWN from the top of the art, so art-v is
      // 1 - v; u is not mirrored either way. Measured off the live pick, not assumed: sampling the
      // barn and comparing getTextureCoordinates() against the hit point's own position on the
      // plane gives |u - uGeo| = 0.001 and |(1 - v) - vDown| = 0.000.
      //
      // The flip-search this replaces only worked while ONE spot existed. Two spots make it unsafe:
      // the cupola's doubly-flipped box (u 0.55-0.68, v 0.69-0.91) lands inside the doors box, so a
      // click on the cupola could open the doors' collection instead.
      const au = u, av = 1 - v;
      return barnSpots.find(s => au >= s.box[0] && au <= s.box[2] && av >= s.box[1] && av <= s.box[3]) || null;
    };

    // The action a pick lands on, or null. Both the tap and the hover cursor go through here, so
    // the pointing hand and the click can never disagree about what is live.
    pickAction = (info) => {
      if (mode !== 'tp') { flyHovered = null; return null; }  // props are live only out on the farm
      const picked = info && info.pickedMesh;
      if (!picked) {
        // Nothing in the scene under the pointer — open sky, the one place a flyover is visible.
        // Reaching them only here is what keeps them behind everything: a mesh in front returns below.
        flyHovered = flyLinkAt(scene.pointerX, scene.pointerY);
        return flyHovered ? flyHovered._flyLink : null;
      }
      flyHovered = null;
      if (picked === barnProp) {                            // per-spot routing
        const uv = info.getTextureCoordinates ? info.getTextureCoordinates() : null;
        if (!uv) return null;
        const spot = resolveBarnSpot(uv.x, uv.y);
        return spot ? spot.action : null;
      }
      const L = propLinks.find(l => l.prop === picked);     // whole-prop links
      return L ? L.action : null;                           // unlinked props stay inert
    };

    scene.onPointerObservable.add((pi) => {
      if (pi.type !== BABYLON.PointerEventTypes.POINTERTAP) return;   // a click/tap (not a drag-rotate)
      if (EDIT_MODE) return;   // while editing, every click belongs to the editor — no popups
      runAction(pickAction(pi.pickInfo));
    });

    applyModeVisibility();   // game starts in overview → show the drawing-ground, hide the 3D scene
    onReady();
  }, null, (s, msg, err) => { console.error('Player GLB failed to load:', msg, err); onReady(); });

}, null, (s, msg, err) => console.error('Farm load failed:', msg, err));

function computeSceneBounds(meshes) {
  let minX=Infinity, minY=Infinity, minZ=Infinity, maxX=-Infinity, maxY=-Infinity, maxZ=-Infinity;
  for (const m of meshes) {
    if (!m.getTotalVertices || m.getTotalVertices() === 0) continue;
    m.computeWorldMatrix(true);
    const bb = m.getBoundingInfo().boundingBox;
    minX = Math.min(minX, bb.minimumWorld.x); maxX = Math.max(maxX, bb.maximumWorld.x);
    minY = Math.min(minY, bb.minimumWorld.y); maxY = Math.max(maxY, bb.maximumWorld.y);
    minZ = Math.min(minZ, bb.minimumWorld.z); maxZ = Math.max(maxZ, bb.maximumWorld.z);
  }
  return {
    center: new BABYLON.Vector3((minX+maxX)/2, (minY+maxY)/2, (minZ+maxZ)/2),
    size:   new BABYLON.Vector3(maxX-minX, maxY-minY, maxZ-minZ),
  };
}

function onReady() { document.getElementById('loading').style.display = 'none'; }

// ─── Keyboard ─────────────────────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'Escape' && mode === 'tp') { switchToIso(); e.preventDefault(); }
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code) && (mode === 'tp' || mode === 'iso')) {
    e.preventDefault();
  }
});
document.addEventListener('keyup', (e) => { keys[e.code] = false; });

// (Double-click focus-on-point / reset-view removed.)
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

// ─── Mode switching ───────────────────────────────────────────────────────────
function switchToTP() {
  mode = 'tp';
  isJumping = false; jumpVelY = 0; jumpLatched = false; tpCamera.applyGravity = true;
  // Always re-enter at the spawn: reset position and camera angle (face the barn, level pitch).
  if (spawnPoint) tpCamera.position.copyFrom(spawnPoint);
  tpCamera.rotation.set(0, Math.PI, 0);
  if (tpCamera.cameraRotation) tpCamera.cameraRotation.copyFromFloats(0, 0);
  isoCamera.detachControl();
  while (scene.activeCameras.length) scene.activeCameras.pop();
  scene.activeCameras.push(tpCamera);
  scene.activeCameras.push(viewCamera);
  tpCamera.viewport   = new BABYLON.Viewport(0, 0, 0.0001, 0.0001);
  viewCamera.viewport = new BABYLON.Viewport(0, 0, 1, 1);
  playerLight.setEnabled(true);   // player orb on in third-person
  // Pull the next flyover in on entry, so dropping down out of the overview is met with sky traffic
  // within a few seconds rather than a fresh 8-22s wait. (Passes now fire in both modes, so nothing
  // is being burned up in iso any more — this is just a welcome, not a repair.)
  nextFlyT = Math.min(nextFlyT, windT + _rand(1.5, 5));
  canvas.focus();
  document.getElementById('toggleBtn').textContent = 'overview';
  applyModeVisibility();
  setTouchControls(true);   // show mobile arrows in third person
}

function switchToIso() {
  mode = 'iso';
  isJumping = false; jumpVelY = 0; jumpLatched = false; tpCamera.applyGravity = true;
  while (scene.activeCameras.length) scene.activeCameras.pop();
  scene.activeCamera = isoCamera;
  playerLight.setEnabled(false);  // player orb off in the overview
  isoLerpTo({ target: new BABYLON.Vector3(tpCamera.position.x, 0, tpCamera.position.z) });
  isoCamera.attachControl(canvas, true);
  canvas.focus();
  document.getElementById('toggleBtn').textContent = 'third person';
  applyModeVisibility();
  setTouchControls(false);  // hide mobile arrows in overview
}

// ─── Mobile third-person touch controls ───────────────────────────────────────
// The arrows drive the SAME `keys` flags the keyboard uses, so all movement /
// turn / sprint logic is reused unchanged. Jump = double-tap on the open scene.
function setTouchControls(show) {
  const tc = document.getElementById('touchControls');
  if (tc) tc.style.display = (show && IS_MOBILE) ? 'block' : 'none';
}

// A keyboard legend has nothing to say on a phone — there is no keyboard, #touchControls IS the
// control, and the corner space is worth more than the list. Hidden once, at load.
if (IS_MOBILE) {
  const c = document.getElementById('controls');
  if (c) c.classList.add('hidden');
}

(function setupTouchControls() {
  // Each arrow drives BOTH the global `keys` (overview movement + sprint/jump checks)
  // AND the third-person walk input's raw keyCode list: in third person, walking/
  // turning is handled by FreeCameraKeyboardWalkInput, which tracks keyCodes in its
  // own _keys array, not the `keys` object. Synthetic key events can't reliably carry
  // keyCode, so we poke that array directly.
  const ARROW_KEYS = {
    arrowUp:    { code: 'ArrowUp',    kc: 38 },
    arrowLeft:  { code: 'ArrowLeft',  kc: 37 },
    arrowRight: { code: 'ArrowRight', kc: 39 },
  };
  const walkInput = () => tpCamera.inputs.attached && tpCamera.inputs.attached.keyboard;
  Object.keys(ARROW_KEYS).forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    const code = ARROW_KEYS[id].code, kc = ARROW_KEYS[id].kc;
    const press = (e) => {
      e.preventDefault();
      keys[code] = true;
      const w = walkInput();
      if (w && w._keys.indexOf(kc) === -1) w._keys.push(kc);
      el.classList.add('active');
      if (e.pointerId != null && el.setPointerCapture) { try { el.setPointerCapture(e.pointerId); } catch (_) {} }
    };
    const release = () => {
      keys[code] = false;
      const w = walkInput();
      if (w) { const i = w._keys.indexOf(kc); if (i >= 0) w._keys.splice(i, 1); }
      el.classList.remove('active');
    };
    el.addEventListener('pointerdown',  press);
    el.addEventListener('pointerup',    release);
    el.addEventListener('pointercancel', release);
    el.addEventListener('pointerleave', release);
  });

  // Double-tap anywhere on the scene → jump (pulse Space; the existing jump-latch
  // logic turns one pulse into a single hop).
  let lastTap = 0, lastX = 0, lastY = 0;
  canvas.addEventListener('pointerup', (e) => {
    if (mode !== 'tp' || e.pointerType === 'mouse') return;
    const dt = e.timeStamp - lastTap;
    const moved = Math.hypot(e.clientX - lastX, e.clientY - lastY);
    if (dt > 0 && dt < 320 && moved < 40) {
      keys['Space'] = true;
      setTimeout(() => { keys['Space'] = false; }, 120);
      lastTap = 0;                       // consume so a triple-tap isn't two jumps
    } else {
      lastTap = e.timeStamp; lastX = e.clientX; lastY = e.clientY;
    }
  });
})();

// The real 3D scene (ground + prop posters) is shown in both modes; overview just views it
// from the iso camera. The character keeps its position across the switch.
function applyModeVisibility() {
  const iso = (mode === 'iso');
  // Swap the top-left legend to the mode being entered. This runs on both switches AND at startup,
  // so the panel never has to work out its own initial state.
  for (const set of document.querySelectorAll('#controls .cset')) {
    set.classList.toggle('on', set.dataset.mode === (iso ? 'iso' : 'tp'));
  }
  if (groundMesh) groundMesh.setEnabled(true);
  for (const wp of windPlanes) if (wp.pivot) wp.pivot.setEnabled(true);
  // Character is larger in overview; feet offset scales with it so it stays planted.
  if (tpMesh && charBaseS) {
    const f = iso ? CHAR_ISO_SCALE : 1;
    tpMesh.scaling.set(charBaseS * f, charBaseS * f, charBaseS * f);
    tpFeetBaseY = charBaseFeetY * f;
  }
}

document.getElementById('toggleBtn').addEventListener('click', () => {
  if (mode === 'iso') switchToTP(); else switchToIso();
});


// ─── Resize ───────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => { engine.resize(); });

// ─── Iso keyboard controls (Babylon Viewer spec) ──────────────────────────────
// Arrow keys              → rotate (orbit alpha/beta)
// Ctrl + Shift + arrows   → pan (move target)
// Alt + Up/Down           → zoom (radius)
function updateIsoKeys() {
  if (mode !== 'iso') return;
  const ctrl  = keys['ControlLeft'] || keys['ControlRight'];
  const shift = keys['ShiftLeft']   || keys['ShiftRight'];
  const alt   = keys['AltLeft']     || keys['AltRight'];
  const speed = 0.025;
  if (alt) {
    const step = isoCamera.radius * 0.04;
    if (keys['ArrowUp'])   isoCamera.radius = Math.max(isoCamera.lowerRadiusLimit, isoCamera.radius - step);
    if (keys['ArrowDown']) isoCamera.radius = Math.min(isoCamera.upperRadiusLimit, isoCamera.radius + step);
  } else if (ctrl && shift) {
    const sp = isoCamera.radius * 0.02;
    const a  = isoCamera.alpha;
    const right   = new BABYLON.Vector3(Math.cos(a), 0, -Math.sin(a));
    const forward = new BABYLON.Vector3(Math.sin(a), 0,  Math.cos(a));
    let pan = BABYLON.Vector3.Zero();
    if (keys['ArrowLeft'])  pan = pan.add(right.scale(-sp));
    if (keys['ArrowRight']) pan = pan.add(right.scale( sp));
    if (keys['ArrowUp'])    pan = pan.add(forward.scale( sp));
    if (keys['ArrowDown'])  pan = pan.add(forward.scale(-sp));
    if (!pan.equalsToFloats(0,0,0)) isoCamera.target = isoCamera.target.add(pan);
  } else if (tpMesh) {
    // Plain arrows / WASD move the CHARACTER, just like third person (iso camera stays put; mouse
    // still controls it). Cameras have no moveWithCollisions, so move the body + ground-follow manually.
    const turn = tpCamera.angularSpeed;
    if (keys['ArrowLeft']  || keys['KeyA']) tpCamera.rotation.y -= turn;
    if (keys['ArrowRight'] || keys['KeyD']) tpCamera.rotation.y += turn;
    const fwd = (keys['ArrowUp'] || keys['KeyW']) ? 1 : (keys['ArrowDown'] || keys['KeyS']) ? -1 : 0;
    const spd = (fwd > 0 && shift) ? WALK_SPEED * SPRINT_MULT : WALK_SPEED;
    if (fwd) {
      tpCamera.position.x += Math.sin(tpCamera.rotation.y) * fwd * spd;
      tpCamera.position.z += Math.cos(tpCamera.rotation.y) * fwd * spd;
    }
    // Rest on the real 3D ground or fall off its edge → fall-respawn recovers.
    const gr = scene.pickWithRay(
      new BABYLON.Ray(tpCamera.position, BABYLON.Vector3.Down(), tpCamera.ellipsoid.y + 5000),
      m => m === groundMesh);
    if (gr && gr.hit) tpCamera.position.y = gr.pickedPoint.y + tpCamera.ellipsoid.y;
    else tpCamera.position.y -= GRAVITY_PER_FRAME;
  }
}

// ─── Auto-crouch ──────────────────────────────────────────────────────────────
// Each frame in TP mode, cast a short ray straight up from the camera position.
// If it hits a ceiling within CROUCH_TRIGGER distance, shrink the ellipsoid so
// the player fits. Restore full height as soon as the ceiling clears.
// The same isCrouching flag will drive animation blending when armature is added.
function updateCrouch() {
  if (mode !== 'tp') return;

  const ray = new BABYLON.Ray(
    tpCamera.position,
    BABYLON.Vector3.Up(),
    CROUCH_TRIGGER
  );
  // barn_second_floor is in KINEMATIC_PLATFORMS so it's excluded here.
  // The actual low ceiling on the second floor is barn_roof / barn walls —
  // those still fire crouch correctly. Excluding barn_second_floor from ceiling
  // detection prevents the BOX shape's underside from triggering false crouches
  // on the staircase landing where the player is still climbing, not yet under
  // a genuinely low ceiling.
  const isCeiling = (m) =>
    m.checkCollisions && m !== groundMesh && m !== tpMesh && !KINEMATIC_PLATFORMS.has(m.name);

  const hit = scene.pickWithRay(ray, isCeiling);

  const ceilingClose = hit && hit.hit && hit.distance < CROUCH_TRIGGER;

  if (ceilingClose && !isCrouching) {
    // Enter crouch — shrink both ellipsoid and offset together so feet
    // stay at the camera origin (same as the full-height setup).
    isCrouching = true;
    tpCamera.ellipsoid.y       = CROUCH_ELLIPSOID_Y;
    tpCamera.ellipsoidOffset.y = CROUCH_ELLIPSOID_Y;
  } else if (!ceilingClose && isCrouching) {
    // Exit crouch — but first check there's enough headroom to stand up.
    // Cast a taller ray to confirm no ceiling within full PLAYER_HEIGHT.
    const standRay = new BABYLON.Ray(tpCamera.position, BABYLON.Vector3.Up(), PLAYER_HEIGHT + 5);
    const standHit = scene.pickWithRay(standRay, isCeiling);
    if (!standHit || !standHit.hit) {
      isCrouching = false;
      tpCamera.ellipsoid.y       = PLAYER_HEIGHT / 2;
      tpCamera.ellipsoidOffset.y = PLAYER_HEIGHT / 2;
    }
    // If there's still a ceiling above, stay crouched until the player
    // moves to a clear area.
  }
}

// ─── Grounded test ────────────────────────────────────────────────────────────
// The camera origin sits ~ellipsoid.y ABOVE the feet (collision ellipsoid rests on
// the floor, so position.y ≈ groundY + ellipsoid.y). Cast down from the origin past
// the feet and call it grounded when the floor is within ellipsoid.y + tolerance.
// Using the live ellipsoid.y auto-adjusts when crouching. The player's own mesh is
// excluded (the ray passes through the character's lower body). Gates jump + landing.
function isGrounded() {
  const reach = tpCamera.ellipsoid.y + GROUND_PROBE;   // feet are ~ellipsoid.y below origin
  const ray = new BABYLON.Ray(tpCamera.position, BABYLON.Vector3.Down(), reach + 4);
  const hit = scene.pickWithRay(ray, (m) =>
    m.checkCollisions && m !== tpMesh && !(m.isDescendantOf && m.isDescendantOf(tpMesh)));
  return !!(hit && hit.hit && hit.distance <= reach);
}

// Distance from the player's feet to the floor (Infinity if none within range) — for landing cushion.
function floorDist() {
  const reach = tpCamera.ellipsoid.y + JUMP_CUSHION + 8;
  const ray = new BABYLON.Ray(tpCamera.position, BABYLON.Vector3.Down(), reach);
  const hit = scene.pickWithRay(ray, (m) =>
    m.checkCollisions && m !== tpMesh && !(m.isDescendantOf && m.isDescendantOf(tpMesh)));
  return (hit && hit.hit) ? Math.max(0, hit.distance - tpCamera.ellipsoid.y) : Infinity;
}

// ─── Perf readout ─────────────────────────────────────────────────────────────
// ?perf=1 only — a live readout, so a claim about performance can be checked instead of assumed.
const _perf = (() => {
  if (!PERF_MODE) return null;
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;right:14px;bottom:14px;z-index:60;background:#2b2b2b;' +
    'border:1px solid #454545;color:#e8e8e8;font:12px/1.5 monospace;padding:9px 12px;' +
    'white-space:pre;pointer-events:none;';
  document.body.appendChild(el);
  const eng = new BABYLON.EngineInstrumentation(engine);
  eng.captureGPUFrameTime = true;
  // Draw calls come from SceneInstrumentation, not the engine. engine.drawCalls does not exist —
  // reading it is what made this line print `undefined` the first time round.
  const sc = new BABYLON.SceneInstrumentation(scene);
  sc.captureDrawCalls = true;
  // Break the CPU half down by subsystem. Babylon meters these itself, which beats switching things
  // off one at a time and reloading — the guessing that cost this project four wasted passes.
  sc.captureSpritesRenderTime = true;          // the 12,150-sprite star dome
  sc.captureRenderTargetsRenderTime = true;    // the 2048px shadow map, re-rendered every frame
  sc.capturePhysicsTime = true;                // Havok
  sc.captureActiveMeshesEvaluationTime = true; // per-frame culling / mesh selection
  return { el, eng, sc, next: 0 };
})();
function updatePerfHud(now) {
  if (!_perf || now < _perf.next) return;
  _perf.next = now + 250;
  const fps = engine.getFps();
  const gpu = _perf.eng.gpuFrameTimeCounter.lastSecAverage / 1e6;   // ns → ms
  // The number worth having. Total frame time is 1000/fps; whatever the GPU did not spend, the CPU
  // did. Which half is over budget decides where to look, and not having this split is precisely
  // how several passes went into subsystems that were never the cost.
  const frame = fps > 0 ? 1000 / fps : 0;
  const cpu   = gpu > 0 ? Math.max(0, frame - gpu) : 0;
  const budget = 16.7;                                             // one frame at 60fps
  const flag = (ms) => ms > budget ? '  OVER' : '';
  const off = [NO_STARS && 'stars', NO_WARP && 'warp', NO_DECOR && 'decor'].filter(Boolean).join(' ');
  // Babylon's counters report in ms already; a dash means the counter never saw that subsystem run.
  const ms = (c) => (c && c.lastSecAverage > 0.01) ? c.lastSecAverage.toFixed(1) + ' ms' : '-';
  _perf.el.textContent =
    'fps      ' + fps.toFixed(0) + '\n' +
    'frame    ' + frame.toFixed(1) + ' ms\n' +
    'gpu      ' + (gpu > 0 ? gpu.toFixed(1) + ' ms' + flag(gpu) : 'n/a') + '\n' +
    'cpu      ' + (cpu > 0 ? cpu.toFixed(1) + ' ms' + flag(cpu) : 'n/a') + '\n' +
    'scale    ' + engine.getHardwareScalingLevel().toFixed(2) + '\n' +
    'render   ' + engine.getRenderWidth() + 'x' + engine.getRenderHeight() + '\n' +
    'draws    ' + _perf.sc.drawCallsCounter.current + '\n' +
    'meshes   ' + scene.getActiveMeshes().length + ' / ' + scene.meshes.length + '\n' +
    '— cpu breakdown —\n' +
    'sprites  ' + ms(_perf.sc.spritesRenderTimeCounter) + '\n' +
    'shadows  ' + ms(_perf.sc.renderTargetsRenderTimeCounter) + '\n' +
    'physics  ' + ms(_perf.sc.physicsTimeCounter) + '\n' +
    'meshEval ' + ms(_perf.sc.activeMeshesEvaluationTimeCounter) + '\n' +
    '— our loop —\n' +
    'player   ' + _jt.player.toFixed(1) + ' ms\n' +
    'sway     ' + _jt.sway.toFixed(1) + ' ms\n' +
    'decor    ' + _jt.decor.toFixed(1) + ' ms\n' +
    'anims    ' + _jt.anims.toFixed(1) + ' ms\n' +
    'arrows   ' + _jt.arrows.toFixed(1) + ' ms\n' +
    'hover    ' + _jt.hover.toFixed(1) + ' ms\n' +
    'stars    ' + _jt.stars.toFixed(1) + ' ms\n' +
    'off      ' + (off || '-');
}

// Per-section timings for our OWN render-loop work, which Babylon's counters cannot see. The
// subsystem breakdown accounted for only 5.6 ms of 23 ms, so the rest is in here somewhere; six
// performance.now() calls a frame is nothing next to knowing which line it is.
const _jt = { player: 0, sway: 0, decor: 0, anims: 0, arrows: 0, hover: 0, stars: 0 };

// ─── Render loop ──────────────────────────────────────────────────────────────
engine.runRenderLoop(() => {
  const _t0 = performance.now();
  updatePerfHud(_t0);
  updateIsoKeys();
  updateCrouch();

  // Plant the character's feet on the real terrain. The collision body's origin rests
  // ~ellipsoid.y above the ground, so the pinned mesh would hover; re-seat it each frame by
  // raycasting down to the ground (follows mounds). Skip while jumping so the jump arc shows.
  if (tpMesh) {
    if (isJumping) {
      // Keep the SAME feet offset as grounded (~ellipsoid.y below the origin) so the character
      // doesn't pop up at takeoff; it then rises/falls smoothly with the camera through the arc.
      tpMesh.position.y = tpFeetBaseY - tpCamera.ellipsoid.y;
    } else {
      const g = groundMesh;   // walk on the real 3D ground in both modes
      const fr = scene.pickWithRay(new BABYLON.Ray(tpCamera.position, BABYLON.Vector3.Down(), 4000), m => m === g);
      tpMesh.position.y = (fr && fr.hit) ? tpFeetBaseY - (tpCamera.position.y - fr.pickedPoint.y) : tpFeetBaseY;
    }
  }

  // Smooth interpolation for iso camera (double-click target/reset, mode switch)
  if (mode === 'iso' && _isoLerp) {
    const L = 0.1;
    if (_isoLerp.target) isoCamera.target = BABYLON.Vector3.Lerp(isoCamera.target, _isoLerp.target, L);
    if (_isoLerp.alpha  !== undefined) isoCamera.alpha  = BABYLON.Scalar.Lerp(isoCamera.alpha,  _isoLerp.alpha,  L);
    if (_isoLerp.beta   !== undefined) isoCamera.beta   = BABYLON.Scalar.Lerp(isoCamera.beta,   _isoLerp.beta,   L);
    if (_isoLerp.radius !== undefined) isoCamera.radius = BABYLON.Scalar.Lerp(isoCamera.radius, _isoLerp.radius, L);
    // Clear once close enough so we stop fighting Babylon's own inertia
    const tDone = !_isoLerp.target || BABYLON.Vector3.Distance(isoCamera.target, _isoLerp.target) < 1;
    const rDone = _isoLerp.radius === undefined || Math.abs(isoCamera.radius - _isoLerp.radius) < 1;
    if (tDone && rDone) _isoLerp = null;
  }

  // ── Third-person camera collision ─────────────────────────────────────────
  // scene.pickWithRay sees the same checkCollisions meshes the player walks
  // into — no Havok needed, and no system mismatch.
  // Ray sweeps from player head to ideal camera world position.
  // On hit, pull viewCamera.position.z in to the safe point.
  // When clear, snap directly to idealZ — no lerp lag means no drifting ahead.
  if (mode === 'tp' && tpMesh) {
    // Sprint — faster only while holding Shift AND moving forward.
    // FreeCameraKeyboardWalkInput reads camera.speed during scene.render() (after
    // this loop body), so setting it here applies this frame.
    const movingForward = keys['ArrowUp'] || keys['KeyW'];
    const sprinting = movingForward && (keys['ShiftLeft'] || keys['ShiftRight']);
    tpCamera.speed = sprinting ? WALK_SPEED * SPRINT_MULT : WALK_SPEED;

    // Jump — single, ground-only. Own vertical velocity for the arc and disable
    // applyGravity so Babylon doesn't double-apply; the line-797 clamp is made
    // jump-aware below so the upward impulse survives to moveWithCollisions.
    if (!keys['Space']) jumpLatched = false;          // released → re-armed
    // Fresh Space press launches a jump — from the ground OR mid-air (re-press to jump again in the air).
    if (keys['Space'] && !jumpLatched) {
      isJumping = true; jumpLatched = true;
      jumpVelY = JUMP_VELOCITY;
      jumpAppliedVY = 0;                   // ramp the applied velocity up from rest → smooth (re)launch
      tpCamera.applyGravity = false;
    }
    if (isJumping) {
      // Variable gravity for a smooth, floaty arc: ease off near the apex (hang time), descend a bit faster.
      let jg = JUMP_GRAVITY;
      if (Math.abs(jumpVelY) < JUMP_HANG_VEL) jg *= JUMP_HANG_MULT;     // hang at the top
      else if (jumpVelY < 0) jg *= JUMP_FALL_MULT;                      // come down a touch quicker
      jumpVelY -= jg;
      // Cushion the landing — within a short zone of the floor, cap the descent to a constant gentle
      // speed (don't decay to 0, which made it crawl). Touches down at JUMP_CUSHION_V.
      if (jumpVelY < -JUMP_CUSHION_V && floorDist() < JUMP_CUSHION) jumpVelY = -JUMP_CUSHION_V;
      if (jumpVelY <= 0 && isGrounded()) {
        isJumping = false; jumpVelY = 0;
        tpCamera.applyGravity = true;
        // Snap the body exactly to its resting height so gravity has no leftover gap to drop → no bounce.
        const land = scene.pickWithRay(
          new BABYLON.Ray(tpCamera.position, BABYLON.Vector3.Down(), tpCamera.ellipsoid.y + GROUND_PROBE + 8),
          (m) => m.checkCollisions && m !== tpMesh && !(m.isDescendantOf && m.isDescendantOf(tpMesh)));
        if (land && land.hit) tpCamera.position.y = land.pickedPoint.y + tpCamera.ellipsoid.y;
      }
    }

    // Barn framing — inside the barn, ease the camera close & down to head height
    // (behind the head); outside, ease back to the far/high body view.
    insideBarn = false;
    if (barnMesh) {
      const bb = barnMesh.getBoundingInfo().boundingBox;
      insideBarn = tpCamera.position.x > bb.minimumWorld.x && tpCamera.position.x < bb.maximumWorld.x &&
                   tpCamera.position.z > bb.minimumWorld.z && tpCamera.position.z < bb.maximumWorld.z;
    }
    const frame = insideBarn ? CAM_BARN : CAM_OUT;
    camIdealZ = BABYLON.Scalar.Lerp(camIdealZ, frame.z, CAM_FRAME_LERP);
    camIdealY = BABYLON.Scalar.Lerp(camIdealY, frame.y, CAM_FRAME_LERP);
    viewCamera.position.y = camIdealY;   // collision code only drives .z; we own .y for head-height

    const idealZ = camIdealZ;
    const idealY = camIdealY;
    const yaw    = tpCamera.rotation.y;

    const idealWorld = tpCamera.position.add(new BABYLON.Vector3(
      -idealZ * Math.sin(yaw),
       idealY,
      -idealZ * Math.cos(yaw)
    ));
    const rayOrigin = tpCamera.position.add(
      new BABYLON.Vector3(0, PLAYER_HEIGHT * 0.9, 0)
    );
    const toCam = idealWorld.subtract(rayOrigin);
    const dist  = toCam.length();

    if (dist > 0.01) {
      const dir    = toCam.normalizeToNew();
      const camRay = new BABYLON.Ray(rayOrigin, dir, dist);
      const hit    = scene.pickWithRay(camRay, (m) =>
        m.isPickable &&
        m.checkCollisions &&
        m !== tpMesh &&
        !excludedCamMeshes.has(m)
      );

      if (hit && hit.hit) {
        const safeDist  = Math.max(0, hit.distance - 5);
        const safeWorld = rayOrigin.add(dir.scale(safeDist));
        const dx = safeWorld.x - tpCamera.position.x;
        const dz = safeWorld.z - tpCamera.position.z;
        let targetZ = dx * Math.sin(yaw) + dz * Math.cos(yaw);
        targetZ = Math.min(-50, targetZ);
        viewCamera.position.z = BABYLON.Scalar.Lerp(viewCamera.position.z, targetZ, 0.15);
      } else {
        viewCamera.position.z = idealZ;  // clear path — lock to ideal, no lag
      }
    }
  }

  // ─── Wind ────────────────────────────────────────────────────────────────
  windT += engine.getDeltaTime() / 1000;
  const dt = Math.min(0.05, engine.getDeltaTime() / 1000);   // clamp to avoid jumps on stalls
  updateWind(windT);                                          // start/stop gusts on the 3–10s schedule

  // Wind-gust overlay — when the active gust's front reaches the player, sweep the wind PNGs
  // across the top of the frame (once per gust). Only in the walking POV.
  if (mode === 'tp' && windGust.active && windGust.t0 !== lastWindFlashT0) {
    const wc = getWind(windT, tpCamera.position.x, tpCamera.position.z);
    if (wc.strength > WIND_FLASH_THRESH) {
      lastWindFlashT0 = windGust.t0;
      flashWindOverlay(windGust.peak);   // streaks always enter from the right
    }
  }

  // Sky flyovers — the constellations/egg drift past on their own clock, with no relation to the
  // gusts. Driven off windT (rather than a setTimeout) so it stops with the render loop on a
  // backgrounded tab instead of queueing up a burst.
  // They fire in BOTH modes. They used to be third-person only, which meant any pass that came due
  // while you were up in the overview was spent on an empty screen. They read fine from up there:
  // the layer sits behind the canvas and the sky around the island clears transparent, so a pass
  // shows through wherever the island does not cover. (The egg's CLICK stays third-person only —
  // see pickAction — because the overview is a map and every prop on it is inert too.)
  if (windT >= nextFlyT) {
    nextFlyT = windT + _rand(FLY_EVERY_MIN, FLY_EVERY_MAX);
    flyPropAcross();
  }

  // Fell off the island? After 3s below the terrain, respawn at the start.
  if (tpMesh && tpCamera.position.y < islandFloorY - 40) {
    fallTime += dt;
    if (fallTime >= 3 && spawnPoint) {
      tpCamera.position.copyFrom(spawnPoint);
      isJumping = false; jumpVelY = 0; jumpAppliedVY = 0; jumpLatched = false; tpCamera.applyGravity = true;
      fallTime = 0;
    }
  } else fallTime = 0;

  // Floaters drift with the wind, bob + flutter, and recycle to the upwind edge.
  // Wind-gust streaks ride the gust front across the island, fading in/out at the ends of the sweep.
  const scam = scene.activeCamera;
  for (let i = 0; i < floaters.length; i++) {
    const s = floaters[i];
    if (!s.active) continue;
    const u = (windT - s.t0) / s.dur;
    if (u >= 1) { s.active = false; s.mesh.setEnabled(false); continue; }
    const along = (s.fStart + u * s.span) - s.projC;           // front position relative to island centre
    s.mesh.position.set(
      islandCX + s.dirx * along - s.dirz * s.across,
      s.y,
      islandCZ + s.dirz * along + s.dirx * s.across
    );
    s.mesh.visibility = Math.min(Math.min(1, u / 0.18), Math.min(1, (1 - u) / 0.18));   // fade in then out
    if (scam) {                                                // mirror so the line points along travel
      const fr = scam.getForwardRay().direction;
      s.mesh.scaling.x = (s.dirx * fr.z - s.dirz * fr.x) < 0 ? -1 : 1;
    }
  }
